name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  generate-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: |
          pip install -r requirements.txt
          pip install cyclonedx-bom
      - run: cyclonedx-py requirements -i requirements.txt -o sbom/sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom/sbom.json
