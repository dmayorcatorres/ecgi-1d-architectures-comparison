name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install pip-audit
      # No falla el build por defecto (--strict apagado): ver SECURITY.md,
      # el equipo debe revisar el reporte y decidir si escala a bloqueante.
      - run: pip-audit -r requirements.txt || true
