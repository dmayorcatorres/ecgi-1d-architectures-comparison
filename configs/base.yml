EPOCHS: 1000
BATCH_SIZE: 32
BETA1: 0.5
BETA2: 0.999
LATENT_DIM: 32
SAVE_FINAL_MODEL_ONLY: True
LR: 0.0001
# Parámetros de Early Stopping
EARLY_STOPPING_PATIENCE: 100
EARLY_STOPPING_MIN_DELTA: 0.001

# Rutas de almacenamiento
DATA_PATH: "./data/raw/kitpvc/"
DATASET: "kitpvc"
MODEL_PATH: "./models"
PLOT_PATH: "./plots"
LOG_PATH: "./logs"
EXPERIMENT_PATH: "./experiments"

# Parámetros de optimización
LEARNING_RATE_GENERATOR: 0.0002  # Tasa de aprendizaje para el Generador
LEARNING_RATE_DISCRIMINATOR: 0.0002  # Tasa de aprendizaje para el Discriminador

# Agregar el modelo
MODEL_TYPE: "simple"  # Puede ser cualquier tipo de GAN que uses, como "DCGAN", "WGAN", etc.

