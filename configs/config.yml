# Configuración general
GENERAL:
  DATA_PATH: "./data/raw/kitpvc/"
  DATASET: "kitpvc"

# Ranges para la búsqueda de hiperparámetros
RANGES:
  LATENT_DIM: [32]       # Valores predefinidos (categoría discreta)
  BATCH_SIZE: [16]        # Valores predefinidos (categoría discreta)
  DROPOUT: [0.1]        # Valores predefinidos (categoría discreta)
  LEARNING_RATE_RANGE: [0.001, 0.01]    # Rango continuo (min, max)
  BETA1_RANGE: [0.5, 0.6]              # Rango continuo (min, max)
  BETA2_RANGE: [0.9, 0.92]            # Rango continuo (min, max)

# Configuración del modelo
MODEL:
  WEIGHT_INIT: "xavier"                # Valor fijo

# Entrenamiento
TRAINING:
  EPOCHS: 50                           # Valor fijo

# Loggers y dispositivos
LOGGING:
  LEVEL: "INFO"                        # Valor fijo
  SAVE_PATH: "./logs/"                 # Valor fijo

DEVICE:
  USE_CUDA: true                       # Valor fijo

