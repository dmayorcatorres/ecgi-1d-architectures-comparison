# Configuración general
GENERAL:
  DATA_PATH: "/workspace/pytorch_project/data/raw/kitpvc/kitpvc_data.mat"
  MODEL_TYPE: ["CGAN"]
  LEVEL: "INFO"                        # Valor fijo
  SAVE_PATH: "./logs/"                 # Valor fijo
  USE_CUDA: true                       # Valor fijo

# Entrenamiento
TRAINING:
  EPOCHS: 200                          # Valor fijo
  BATCH_SIZE: [16, 32, 64, 128]
  LEARNING_RATE_RANGE: [0.0001, 0.01]    # Rango continuo (min, max)
  BETA1_RANGE: [0.5, 0.9]              # Rango continuo (min, max)
  BETA2_RANGE: [0.9, 0.999]            # Rango continuo (min, max)


